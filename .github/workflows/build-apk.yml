name: Build Android APK (Catatan by Iswandi)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Memungkinkan tombol "Run workflow" ditekan langsung lewat browser HP

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android Licenses & Install SDK Platform 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx @capacitor/cli sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy & Prepare APK for Direct Download
        run: |
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk ./Catatan-by-Iswandi.apk
          else
            find android/app/build/outputs/apk/debug -name "*.apk" -exec cp {} ./Catatan-by-Iswandi.apk \;
          fi
          ls -lh ./Catatan-by-Iswandi.apk

      - name: Upload APK as Workflow Artifact (Download via HP)
        uses: actions/upload-artifact@v4
        with:
          name: Catatan-by-Iswandi-APK
          path: ./Catatan-by-Iswandi.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK (Direct Download for Phone)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Catatan by Iswandi APK v1.0.${{ github.run_number }}
          body: |
            ### 📱 File APK Catatan by Iswandi Siap Pasang
            - **Versi**: 1.0.${{ github.run_number }}
            - **Status**: Berhasil dibuild secara otomatis via GitHub Actions
            - **Cara Pasang di HP Android**:
              1. Unduh file `Catatan-by-Iswandi.apk` di bawah ini.
              2. Buka berkas yang telah diunduh di HP Anda.
              3. Izinkan instalasi dari sumber tidak dikenal jika diminta oleh Android.
              4. Aplikasi siap digunakan 100% offline!
          files: ./Catatan-by-Iswandi.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
